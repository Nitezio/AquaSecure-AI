version: '3.8'

services:
  python-ai:
    build:
      context: ./ai-detector
    ports:
      - "8000:8000"
    volumes:
      - ./ai-detector/models:/app/models

  telemetry-streamer:
    build:
      context: ./telemetry-streamer
    ports:
      - "3001:3001"
    environment:
      - PYTHON_PREDICT_URL=http://python-ai:8000/predict
    depends_on:
      - python-ai

  frontend-dashboard:
    build:
      context: ./web-dashboard
    ports:
      - "80:80"
    depends_on:
      - telemetry-streamer
